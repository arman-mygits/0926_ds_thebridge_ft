<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Hundir la flota - Diagrama</title>
<style>
  body{margin:0;background:#0f1b2d;color:#e8eef7;font-family:Segoe UI,Arial,sans-serif;padding:24px}
  h1{text-align:center;margin:0 0 4px;font-size:32px}
  p.sub{text-align:center;margin:0 0 20px;color:#8fa6c4}
  svg{display:block;margin:0 auto;max-width:100%;height:auto}
  text{font-family:Segoe UI,Arial,sans-serif;fill:#e8eef7}
  .t{font-size:15px}.s{font-size:12.5px;fill:#b7c6dc}.h{font-size:18px;font-weight:700}
  .box{fill:#1b2f4b;stroke:#4da3ff;stroke-width:2;rx:10}
  .dec{fill:#3a2f12;stroke:#ffc247;stroke-width:2}
  .end{fill:#143a2a;stroke:#3ddc97;stroke-width:2;rx:22}
  .lose{fill:#3d1a22;stroke:#ff6b7a;stroke-width:2;rx:22}
  .mod{fill:#13243b;stroke-width:2.5;rx:14}
  .ar{stroke:#8fa6c4;stroke-width:2;fill:none;marker-end:url(#a)}
</style>
</head>
<body>
<h1>Hundir la flota</h1>
<p class="sub">Estructura del código y flujo de una partida</p>

<svg viewBox="0 0 1200 760" width="1200">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8fa6c4"/></marker></defs>

  <!-- MODULES -->
  <rect class="mod" x="20" y="20" width="360" height="330" stroke="#ffc247"/>
  <text class="h" x="40" y="50">main.py  ·  flujo del juego</text>
  <text class="s" x="40" y="72">jugar() · bucle de turnos</text>
  <rect class="box" x="40" y="90" width="320" height="52"/><text class="t" x="55" y="112">Crear 2 tableros y colocar barcos</text><text class="s" x="55" y="130">jugador y máquina</text>
  <rect class="box" x="40" y="160" width="320" height="52"/><text class="t" x="55" y="182">Turno jugador</text><text class="s" x="55" y="200">lee coordenada → dispara</text>
  <rect class="box" x="40" y="230" width="320" height="52"/><text class="t" x="55" y="252">Turno máquina</text><text class="s" x="55" y="270">disparo aleatorio sin repetir</text>
  <rect class="box" x="40" y="300" width="320" height="40"/><text class="t" x="55" y="325">¿Quedan barcos? → ganar / perder</text>

  <rect class="mod" x="20" y="380" width="360" height="360" stroke="#3ddc97"/>
  <text class="h" x="40" y="410">utils.py  ·  funciones</text>
  <g class="t">
    <text x="40" y="445">crear_tablero(tamaño)</text><text class="s" x="40" y="462">matriz numpy 10x10 de "_"</text>
    <text x="40" y="492">crear_barco(eslora)</text><text class="s" x="40" y="509">casillas aleatorias + orientación</text>
    <text x="40" y="539">colocar_barco(barco, tablero)</text><text class="s" x="40" y="556">valida límites y solapes</text>
    <text x="40" y="586">colocar_barcos(tablero)</text><text class="s" x="40" y="603">6 barcos: 2,2,2,3,3,4</text>
    <text x="40" y="633">disparar(casilla, tablero)</text><text class="s" x="40" y="650">O→X tocado · _→A agua</text>
    <text x="40" y="680">disparo_maquina() · leer_coordenada()</text>
    <text x="40" y="710">quedan_barcos() · mostrar_tableros()</text>
  </g>
  <path class="ar" d="M200 350 L200 378" stroke-dasharray="6 5"/>
  <text class="s" x="210" y="368">usa</text>

  <!-- FLOW -->
  <text class="h" x="440" y="40">Flujo de una partida</text>
  <rect class="end" x="560" y="60" width="200" height="44"/><text class="t" x="660" y="88" text-anchor="middle">Inicio</text>
  <path class="ar" d="M660 104 L660 132"/>
  <rect class="box" x="520" y="134" width="280" height="50"/><text class="t" x="660" y="157" text-anchor="middle">Colocar barcos (aleatorio)</text><text class="s" x="660" y="175" text-anchor="middle">mi tablero + tablero enemigo</text>
  <path class="ar" d="M660 184 L660 212"/>
  <rect class="box" x="520" y="214" width="280" height="50"/><text class="t" x="660" y="237" text-anchor="middle">Turno del jugador</text><text class="s" x="660" y="255" text-anchor="middle">introduce fila,columna</text>
  <path class="ar" d="M660 264 L660 292"/>
  <polygon class="dec" points="660,294 770,334 660,374 550,334"/><text class="t" x="660" y="339" text-anchor="middle">¿Tocado?</text>
  <path class="ar" d="M550 334 L470 334 L470 239 L518 239"/><text class="s" x="478" y="326">Sí: repite</text>
  <path class="ar" d="M660 374 L660 402"/><text class="s" x="668" y="394">No (agua)</text>
  <rect class="box" x="520" y="404" width="280" height="50"/><text class="t" x="660" y="427" text-anchor="middle">Turno de la máquina</text><text class="s" x="660" y="445" text-anchor="middle">dispara a casilla aleatoria</text>
  <path class="ar" d="M660 454 L660 482"/>
  <polygon class="dec" points="660,484 770,524 660,564 550,524"/><text class="t" x="660" y="529" text-anchor="middle">¿Tocado?</text>
  <path class="ar" d="M770 524 L850 524 L850 429 L802 429"/><text class="s" x="800" y="516">Sí: repite</text>
  <path class="ar" d="M660 564 L660 592"/><text class="s" x="668" y="584">No</text>
  <polygon class="dec" points="660,594 790,634 660,674 530,634"/><text class="t" x="660" y="632" text-anchor="middle">¿Quedan barcos</text><text class="t" x="660" y="650" text-anchor="middle">a ambos?</text>
  <path class="ar" d="M530 634 L440 634 L440 239 L518 239" stroke-dasharray="6 5"/><text class="s" x="448" y="626">Sí: otra ronda</text>
  <path class="ar" d="M790 634 L860 634 L860 700"/>
  <rect class="end" x="760" y="700" width="200" height="44"/><text class="t" x="860" y="727" text-anchor="middle">Fin · ganas / pierdes</text>

  <!-- LEGEND -->
  <g transform="translate(940,70)">
    <text class="h" x="0" y="0">Leyenda del tablero</text>
    <text class="t" x="0" y="30">_  sin explorar</text>
    <text class="t" x="0" y="55">O  barco</text>
    <text class="t" x="0" y="80">X  tocado</text>
    <text class="t" x="0" y="105">A  agua</text>
    <text class="s" x="0" y="140">Barcos: 3×eslora 2,</text>
    <text class="s" x="0" y="158">2×eslora 3, 1×eslora 4</text>
  </g>
</svg>
</body>
</html>
